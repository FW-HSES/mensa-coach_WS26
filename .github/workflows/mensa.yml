name: Mensa-Daten

on:
  schedule:
    - cron: "7 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install requests beautifulsoup4

      - name: Speiseplan holen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mensa.py

      - name: Daten speichern
        if: always()
        run: |
          git config user.name "mensa-bot"
          git config user.email "mensa-bot@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          git diff --cached --quiet || git commit -m "Speiseplan aktualisiert"
          git push
